on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Lint
        run: mise run lint
  bootstrap:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: false
      # source を ~/dotfiles 固定で書いているため配置を合わせる
      - name: Place repo at ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"
      - name: Validate config
        run: |
          mise trust ~/dotfiles/home/.mise.toml
          mise bootstrap plan -C ~/dotfiles/home
      - name: Apply dotfiles
        run: mise bootstrap -C ~/dotfiles/home --yes --only dotfiles --force-dotfiles
      - name: Check convergence
        run: mise bootstrap dotfiles status -C ~/dotfiles/home --missing
