on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Lint
        run: mise run lint
  bootstrap:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
      # source を ~/dotfiles 固定で書いているため配置を合わせる
      - name: Place repo at ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"
      - name: Validate config
        run: |
          mise trust ~/dotfiles/home/.mise.toml
          mise trust ~/dotfiles/home/.mise.work.toml
          mise trust ~/dotfiles/home/.mise.personal.toml
          mise bootstrap plan -C ~/dotfiles/home
          mise bootstrap dotfiles status -C ~/dotfiles/home -E work
          mise bootstrap dotfiles status -C ~/dotfiles/home -E personal
      - name: Apply dotfiles
        run: mise bootstrap -C ~/dotfiles/home --yes --only dotfiles --force-dotfiles
      - name: Check convergence
        run: mise bootstrap dotfiles status -C ~/dotfiles/home --missing
