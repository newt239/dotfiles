# 私用マシンのアプリ。`mise bootstrap -E personal` で共通設定と一緒に適用される

[dotfiles]
"~/.gitconfig.local" = "~/dotfiles/config/git/gitconfig.personal"

[bootstrap.packages]
"mas:497799835" = "latest"   # Xcode
"mas:1429033973" = "latest"  # RunCat
"mas:539883307" = "latest"   # LINE
"mas:409183694" = "latest"   # Keynote
"mas:409203825" = "latest"   # Numbers
"mas:409201541" = "latest"   # Pages
"mas:682658836" = "latest"   # GarageBand
"mas:408981434" = "latest"   # iMovie

[bootstrap.hooks]
pre-packages = "~/dotfiles/.bin/brew.sh personal"
